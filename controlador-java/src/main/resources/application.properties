spring.application.name=controlador-java
server.port=8080

# URL base del servicio PHP (siguiente eslabon de la cadena).
# Se lee en ejecucion desde la variable de entorno PHP_SERVICE_URL;
# el valor por defecto solo sirve para que la aplicacion arranque sin ella.
servicio.php.url=${PHP_SERVICE_URL:http://localhost:8081}

# Los errores se responden siempre con el formato JSON del contrato,
# sin trazas ni paginas HTML.
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
