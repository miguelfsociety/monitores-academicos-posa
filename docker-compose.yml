# Servidor 3 (PC3): Servicio Python + base de datos MySQL.
# Los valores se leen del archivo .env (copiar .env.example a .env).
name: posa-python

services:
  bd:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitores}
      MYSQL_USER: ${MYSQL_USER:-monitores}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en el archivo .env}
    volumes:
      - datos-bd:/var/lib/mysql
      # Scripts que MySQL ejecuta solo la primera vez (volumen vacío).
      - ./bd/init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": el 3306 no se publica; solo el servicio Python llega a la BD.
    healthcheck:
      # Consulta real por TCP: mientras MySQL ejecuta los scripts de inicio no
      # acepta conexiones TCP, así que solo pasa cuando los datos ya están.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1 FROM materias LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  servicio-python:
    build: .
    image: posa-python-servicio
    restart: unless-stopped
    depends_on:
      bd:
        condition: service_healthy
    environment:
      BD_HOST: bd
      BD_PUERTO: "3306"
      BD_NOMBRE: ${MYSQL_DATABASE:-monitores}
      BD_USUARIO: ${MYSQL_USER:-monitores}
      BD_CLAVE: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en el archivo .env}
    ports:
      - "${PUERTO:-8000}:8000"

volumes:
  datos-bd:

networks:
  default:
    ipam:
      config:
        - subnet: 10.213.3.0/24
